# kbmcp corpus manifest — the curated, web-verified source list for the hard
# mixed-domain eval/demo corpus. Versions are AUTHOR-PINNED (arXiv vN, Wikipedia
# oldid, retrieval date); fetch.py records them verbatim into corpus/raw/*.meta.json.
# Shipped-index posture: fair-use + per-source attribution NOTICE; the `license`
# field records each source's actual license so any one can be swapped/removed in
# one line if challenged. See docs/superpowers/specs/2026-07-16-phase1-corpus-design.md.
#
# Verified 2026-07-23 (Milestone 2, Task 8: AI/RAG/LLM domain).

