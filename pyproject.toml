[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbmcp"
version = "0.0.1"
description = "Retrieval-only knowledge-base MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp[cli]>=1.28.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyyaml>=6.0,<7",
]
corpus = [
    # Dev-only ingest deps ([corpus] extra). Version floors are provisional and
    # finalized (verify-then-pin) in the milestone that first installs each dep.
    "docling>=2.118,<3",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "curl-cffi>=0.7.0",
    "anthropic>=0.69.0",
    "rank-bm25>=0.2.2",
    "datasketch>=1.6.0",
    "pyyaml>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]
